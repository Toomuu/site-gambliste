<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" type="image/png" href="images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gambliste - La Roulette</title>
    <link rel="stylesheet" href="css/roulette.css">
</head>
<body>

<header class="navbar">
    <div class="logo-conteneur">
        <img src="images/logo.png" alt="Logo Gambliste" class="logo-image">
        <h1 class="titre-principal">GAMBLISTE</h1>
    </div>
    <nav class="liens-navbar">
        <a href="index.html">Accueil</a>
        <a href="planning.html">Planning</a>
        <a href="allos.html">Allos</a>
        <a href="roulette.html">Roulette</a>
    </nav>
</header>

<main class="contenu-roulette">
    <h2 class="titre-jeu">LA ROUE DU GAMBLING</h2>
    
    <div class="roulette-wrapper">
        <div class="fleche-selection">▼</div>
        <canvas id="wheel" width="500" height="500"></canvas>
        <button id="spinBtn">LANCER LA ROUE</button>
    </div>
</main>

<div id="resultModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="winnerName" style="font-family: 'Jersey 15', cursive; font-size: 40px;"></h2>
        <img id="winnerPhoto" src="" alt="Gagnant" style="width: 200px; height: 200px; object-fit: cover; border-radius: 50%; border: 5px solid #b6231b;">
        
        <p id="winnerPhone" style="font-size: 24px; font-weight: bold; margin-top: 20px; font-family: 'Kanit', sans-serif;"></p>
    </div>
</div>

<script>
    const members = [
        { name: "Milou", img: "images/Roulette/Mylo2.jpg", phone: "07 64 41 82 84" },
        { name: "Mathis", img: "images/Roulette/Mathis1.jpg", phone: "06 68 11 48 43" },
        { name: "Andreas", img: "images/Roulette/Andreas1.jpg", phone: "06 16 42 26 74" },
        { name: "Baptou", img: "images/Roulette/Baptou1.jpg", phone: "07 68 60 62 25" },
        { name: "Orane", img: "images/Roulette/Orane2.jpg", phone: "07 88 56 98 33" },
        { name: "Hermione", img: "images/Roulette/Hermione1.jpg", phone: "07 63 20 25 03" },
        { name: "Juju", img: "images/Roulette/Juju1.jpg", phone: "06 52 08 08 09" },
        { name: "Jojo", img: "images/Roulette/Jojo1.jpg", phone: "06 69 03 52 81" },
        { name: "Pecouz", img: "images/Roulette/Pecouz4.jpg", phone: "06 36 18 88 80" },
        { name: "Clément", img: "images/Roulette/Clement1.jpg", phone: "07 67 73 80 68" },
        { name: "Marie", img: "images/Roulette/Marie1.jpg", phone: "06 30 72 74 53" },
        { name: "Mymy", img: "images/Roulette/Mymy2.jpg", phone: "07 60 38 96 16" },
        { name: "Gabriel", img: "images/Roulette/Gabriel1.jpg", phone: "07 68 99 51 97" },
        { name: "Tom", img: "images/Roulette/Tom2.jpg", phone: "07 82 88 18 66" }
    ];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    
    let startAngle = 0;
    const arc = Math.PI / (members.length / 2);
    let spinAngleStart = 10;
    let spinTime = 0;
    let spinTimeTotal = 0;

    function drawWheel() {
        ctx.clearRect(0,0,500,500);
        for(let i = 0; i < members.length; i++) {
            const angle = startAngle + i * arc;
            
            // Case verte spéciale pour le Président, sinon alternance Casino
            if (members[i].name === "Milou") {
                ctx.fillStyle = "#1e874a"; 
            } else {
                ctx.fillStyle = i % 2 === 0 ? "#b6231b" : "#111"; 
            }

            ctx.beginPath();
            ctx.arc(250, 250, 230, angle, angle + arc, false);
            ctx.lineTo(250, 250);
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.stroke();

            ctx.save();
            ctx.fillStyle = "#fff";
            ctx.translate(250 + Math.cos(angle + arc/2) * 170, 250 + Math.sin(angle + arc/2) * 170);
            ctx.rotate(angle + arc/2 + Math.PI/2);
            ctx.font = 'bold 12px Arial';
            ctx.fillText(members[i].name, -ctx.measureText(members[i].name).width/2, 0);
            ctx.restore();
        }
    }

    function rotateWheel() {
        spinTime += 30;
        if(spinTime >= spinTimeTotal) {
            const degrees = startAngle * 180 / Math.PI + 90;
            const arcd = arc * 180 / Math.PI;
            const index = Math.floor((360 - degrees % 360) / arcd);
            const winner = members[index];
            
            document.getElementById("winnerName").innerText = winner.name;
            document.getElementById("winnerPhoto").src = winner.img;
            
            const winnerPhone = document.getElementById("winnerPhone");
            if(winnerPhone) {
                winnerPhone.innerHTML = `<a href="tel:${winner.phone.replace(/\s/g, '')}" style="color: #b6231b; text-decoration: none;">📞 ${winner.phone}</a>`;
            }

            document.getElementById("resultModal").style.display = "flex";
            spinBtn.disabled = false;
            return;
        }
        const spinAngle = spinAngleStart - (spinTime / spinTimeTotal) * spinAngleStart;
        startAngle += (spinAngle * Math.PI / 180);
        drawWheel();
        setTimeout(rotateWheel, 30);
    }

    spinBtn.onclick = () => {
        spinAngleStart = Math.random() * 10 + 10;
        spinTime = 0;
        spinTimeTotal = Math.random() * 3000 + 4000;
        spinBtn.disabled = true;
        rotateWheel();
    };

    document.querySelector(".close").onclick = () => document.getElementById("resultModal").style.display = "none";
    drawWheel();
</script>
<script src="js/global.js"></script>
</body>
</html>
